<title>Simulador Locus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Concepto: herramienta de análisis sobria con la identidad de Locus (azul marino, verde azulado, coral solo para la acción principal). */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface2:#EEF2F6; --ink:#12263F; --muted:#56687F; --line:#D5DDE6;
  --navy:#003366; --teal:#00796F; --cta:#E8484E; --cta-ink:#FFFFFF;
  --cA:#C85A14; --cB:#00796F; --cC:#5256C8;
  --ok:#17794A; --ok-bg:#DDF3E7; --bad:#B42331; --bad-bg:#FBE1E3; --warn:#8A5A00; --warn-bg:#FCEFCC;
  --focus:#1E6FD9;
  --f-display:'Fraunces',Georgia,serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1828; --surface:#13243A; --surface2:#1A2E48; --ink:#E7EDF5; --muted:#9DB0C6; --line:#27405F;
  --navy:#7FB2E8; --teal:#34C3B4; --cta:#FF6A6F; --cta-ink:#1A0A0B;
  --cA:#F09A5C; --cB:#34C3B4; --cC:#A3A7FF;
  --ok:#5FD392; --ok-bg:#173B2B; --bad:#FF8791; --bad-bg:#47202A; --warn:#F2C25B; --warn-bg:#40330F; --focus:#7DB4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1828; --surface:#13243A; --surface2:#1A2E48; --ink:#E7EDF5; --muted:#9DB0C6; --line:#27405F;
  --navy:#7FB2E8; --teal:#34C3B4; --cta:#FF6A6F; --cta-ink:#1A0A0B;
  --cA:#F09A5C; --cB:#34C3B4; --cC:#A3A7FF;
  --ok:#5FD392; --ok-bg:#173B2B; --bad:#FF8791; --bad-bg:#47202A; --warn:#F2C25B; --warn-bg:#40330F; --focus:#7DB4FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:26px} h2{font-size:21px} h3{font-size:16px;font-family:var(--f-body);font-weight:600;color:var(--ink)}
p{margin:0;max-width:68ch} a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:20px;padding-block:20px}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.brand h1{font-size:21px}
.navgroup{display:flex;flex-direction:column;gap:4px}
.navgroup+.navgroup{margin-top:14px}
.navlabel{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 12px 4px}
.tab{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:500;text-align:left;min-height:46px;width:100%}
.tab:hover{background:var(--surface2)}
.tab .ic{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface)}
.tab .ic svg{width:16px;height:16px}
.tab .lbl{flex:1;min-width:0}
.tab .lbl .short{display:none}
.tab .badge{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--surface2);color:var(--muted)}
.tab .badge.warn{background:var(--warn-bg);color:var(--warn)}
.tab[aria-selected="true"]{background:var(--navy);color:var(--bg)}
.tab[aria-selected="true"] .ic{background:var(--bg);border-color:var(--bg);color:var(--navy)}
.tab[aria-selected="true"] .badge{background:rgba(255,255,255,.22);color:inherit}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;white-space:nowrap;min-height:44px;width:100%}
.content{min-width:0;padding-block:20px 8px;display:flex;flex-direction:column;gap:24px}
.easy{border-color:var(--teal)}
.easy-sum{font-size:16px;line-height:1.55;max-width:75ch}
.easy-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:14px;max-width:80ch}
.easy-steps>li::marker{font-weight:700;color:var(--teal)}
.easy-steps ul{margin-top:8px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.pager .btn{display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1.3;min-width:150px}
.pager .btn small{font-weight:400;color:var(--muted);font-size:12px}
.pager .next{align-items:flex-end;margin-left:auto}
.view{display:none;gap:20px;flex-direction:column}
.view.on{display:flex}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid>*{min-width:0}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
label .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical;min-height:84px}
input[type=range]{width:100%;accent-color:var(--teal);min-height:32px}
.btn{border:1px solid var(--navy);background:transparent;color:var(--navy);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.errors{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 14px;font-size:13px}
.errors ul{margin:0;padding-left:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.best{font-weight:700;color:var(--ok)}
.tag{font-family:var(--f-mono);font-weight:500;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--bg);font-size:13px}
.tA{background:var(--cA)} .tB{background:var(--cB)} .tC{background:var(--cC)}
.banner{border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface)}
.banner.ok{border-color:var(--ok);background:var(--ok-bg)} .banner.none{border-color:var(--warn);background:var(--warn-bg)}
.banner h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.flow span.node{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.flow span.arrow{color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.cols2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.small{font-size:13px;color:var(--muted)}
.stale{margin-left:6px}
pre{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);border-radius:8px;padding:12px;overflow-x:auto;margin:0;line-height:1.6}
code{font-family:var(--f-mono);font-size:.92em;background:var(--surface2);padding:1px 5px;border-radius:4px}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
svg text{fill:var(--ink);font-family:var(--f-body)}
svg .muted{fill:var(--muted)}
.chartbox{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.vcard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.vcard .why{font-size:13px;color:var(--muted)}
.vcard .ctrl{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr);gap:12px;align-items:center}
.delta{font-size:12px;color:var(--muted)}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy code{overflow-wrap:anywhere}
.step{display:flex;gap:12px}
.step b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--bg);display:grid;place-items:center;font-size:13px}
#printReport{display:none}
.hint-pdf{font-size:13px}
@media print{
  @page{size:A4;margin:14mm}
  body{padding:0!important;background:#fff!important;color:#111!important;font-size:11.5px}
  body::before{display:none!important}
  .wrap>*:not(#printReport){display:none!important}
  #printReport{display:block}
  #printReport h1{font-size:20px} #printReport h2{font-size:15px;margin-top:6px} #printReport h3{font-size:12.5px}
  .rep-sc{break-before:page;display:flex;flex-direction:column;gap:10px}
  .rep-head+.rep-sc{break-before:auto}
  #printReport h2,#printReport h3{break-after:avoid}
  .rep-chart{break-inside:avoid}
  #printReport,#printReport *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rep-head{display:flex;flex-direction:column;gap:8px}
  #printReport table{font-size:10.5px} #printReport th,#printReport td{padding:5px 8px}
  .tablewrap{overflow:visible;border-radius:0}
  .banner{break-inside:avoid} svg{max-width:100%!important;min-width:0!important;height:auto}
}
@media (max-width:900px){
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:static;padding-block:14px 0;gap:12px}
  .brand h1{font-size:20px}
  .side .iconbtn{width:auto;align-self:flex-start;padding:8px 14px;min-height:40px}
  .navlabel{display:none}
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  #tabs .navgroup{display:contents}
  .navgroup+.navgroup{margin-top:0}
  .tab{flex-direction:column;gap:3px;padding:6px 2px;text-align:center;font-size:11px;min-height:56px;justify-content:center;border-radius:8px}
  .tab .lbl .long{display:none} .tab .lbl .short{display:inline}
  .tab .lbl{flex:none}
  .tab .ic{width:26px;height:26px}
  .tab .badge{position:absolute;top:2px;right:6px;font-size:10px;padding:0 6px}
  .tab{position:relative}
  .content{padding-top:12px}
}
@media (max-width:520px){h1{font-size:22px}.card{padding:14px}.vcard .ctrl{grid-template-columns:1fr}}
</style>

<div class="wrap">

      <section class="view" id="v-resultados" aria-label="Resultados"></section>
      <section class="view" id="v-pruebas" aria-label="Pruebas"></section>
      <section class="view" id="v-documentacion" aria-label="Documentación"></section>
      <nav class="pager" id="pager" aria-label="Navegación entre pasos"></nav>
    </main>
  </div>
  <div id="printReport" aria-hidden="true"></div>
</div>

<script>
(function () {
  'use strict';
  var M = window.LocusModel, TS = window.LocusTests;
  var P = M.PARAMS, C = P.common, ARCHS = M.ARCHS;
  var KEY = 'locus-sim9-v2';
  var VIEWS = [['proyecto', 'Proyecto'], ['alternativas', 'Alternativas'], ['escenarios', 'Escenarios'], ['resultados', 'Resultados'], ['pruebas', 'Pruebas'], ['documentacion', 'Documentación']];
  var WLABEL = { lat: 'Latencia', av: 'Disponibilidad', cost: 'Costo', scal: 'Escalabilidad', simp: 'Simplicidad para el equipo' };
  var state = { pdfScope: 'one', proj: M.defaultProject(), scenarios: M.defaultScenarios(), active: 'ref', runs: {}, runView: 'ref', sweepVar: 'users', sweepMetric: 'p95', view: 'proyecto' };

  /* ---------- utilidades ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function nf(x, d) { if (!isFinite(x)) return '∞'; return Number(x).toLocaleString('es-CO', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function ms(x) { return x > 60000 ? '> 60 s' : nf(x, 0) + ' ms'; }
  function tag(k) { return '<span class="tag t' + k + '" title="' + esc(P[k].label) + '">' + k + '</span>'; }
  function save() { if ($('#badge-resultados')) updateNav(); try { localStorage.setItem(KEY, JSON.stringify({ proj: state.proj, scenarios: state.scenarios, active: state.active })); } catch (e) {} }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && s.proj && s.scenarios && s.scenarios.length) { state.proj = Object.assign(M.defaultProject(), s.proj); state.scenarios = s.scenarios; state.active = s.active || s.scenarios[0].id; }
    } catch (e) {}
  }
  function scen(id) { return state.scenarios.filter(function (s) { return s.id === id; })[0]; }
  function sig() { return JSON.stringify(state.proj); }
  function runScenario(id) {
    var s = scen(id); if (!s) return;
    var r = M.runScenario(s.vars, state.proj);
    if (r.ok) state.runs[id] = { run: r, vars: JSON.stringify(s.vars), proj: sig(), name: s.name };
    if ($('#badge-resultados')) updateNav();
    return r;
  }
  function isStale(id) { var r = state.runs[id], s = scen(id); return !r || !s || r.vars !== JSON.stringify(s.vars) || r.proj !== sig(); }

  /* ---------- navegación ---------- */
  var NAV = {
    proyecto: { n: 1, short: 'Proyecto' }, alternativas: { n: 2, short: 'Opciones' }, escenarios: { n: 3, short: 'Escenarios' }, resultados: { n: 4, short: 'Resultados' },
    pruebas: { short: 'Pruebas', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>' },
    documentacion: { short: 'Docs', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg>' }
  };
  function tabHtml(v) {
    var d = NAV[v[0]];
    return '<button class="tab" role="tab" data-v="' + v[0] + '" id="tab-' + v[0] + '"><span class="ic">' + (d.n || d.svg) + '</span><span class="lbl"><span class="long">' + v[1] + '</span><span class="short">' + d.short + '</span></span><span class="badge" id="badge-' + v[0] + '" hidden></span></button>';
  }
  function buildTabs() {
    var t = $('#tabs');
    t.innerHTML = '<div class="navgroup"><div class="navlabel">Flujo de trabajo</div>' + VIEWS.slice(0, 4).map(tabHtml).join('') + '</div><div class="navgroup"><div class="navlabel">Consulta</div>' + VIEWS.slice(4).map(tabHtml).join('') + '</div>';
    t.addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) go(b.dataset.v); });
  }
  function updateNav() {
    var ran = state.scenarios.filter(function (s) { return state.runs[s.id]; }), stale = ran.some(function (s) { return isStale(s.id); });
    var set = function (id, txt, warn) { var b = $('#badge-' + id); if (!b) return; b.hidden = !txt; b.textContent = txt || ''; b.className = 'badge' + (warn ? ' warn' : ''); b.title = warn ? 'Hay resultados desactualizados' : ''; };
    set('escenarios', String(state.scenarios.length), false);
    set('resultados', ran.length ? (stale ? '!' : String(ran.length)) : '', stale);
  }
  function renderPager(v) {
    var idx = VIEWS.map(function (x) { return x[0]; }).indexOf(v), p = idx > 0 ? VIEWS[idx - 1] : null, n = idx < VIEWS.length - 1 ? VIEWS[idx + 1] : null;
    $('#pager').innerHTML = (p ? '<button class="btn prev" type="button" data-v="' + p[0] + '"><small>Anterior</small>← ' + p[1] + '</button>' : '<span></span>') + (n ? '<button class="btn primary next" type="button" data-v="' + n[0] + '"><small style="color:inherit;opacity:.85">Siguiente</small>' + n[1] + ' →</button>' : '');
  }
  function go(v, noHash) {
    state.view = v;
    VIEWS.forEach(function (x) {
      var on = x[0] === v;
      $('#v-' + x[0]).classList.toggle('on', on);
      $('#tab-' + x[0]).setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) $('#tab-' + x[0]).setAttribute('aria-current', 'page'); else $('#tab-' + x[0]).removeAttribute('aria-current');
    });
    if (!noHash) { try { history.replaceState(null, '', '#' + v); } catch (e) { location.hash = v; } }
    render(v);
    renderPager(v); updateNav();
    window.scrollTo(0, 0);
  }
  function render(v) {
    ({ proyecto: renderProyecto, alternativas: renderAlternativas, escenarios: renderEscenarios, resultados: renderResultados, pruebas: renderPruebas, documentacion: renderDoc })[v]();
  }

  /* ---------- 1. Proyecto ---------- */
  function numField(id, label, hint, val, min, max, step) {
    return '<label for="' + id + '">' + label + (hint ? '<span class="hint">' + hint + '</span>' : '') + '<input id="' + id + '" type="number" inputmode="decimal" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"></label>';
  }
  function renderProyecto() {
    var p = state.proj, el = $('#v-proyecto');
    var wsum = M.WEIGHT_KEYS.reduce(function (a, k) { return a + (+p.weights[k] || 0); }, 0);
    el.innerHTML =
      '<div><h2>Configuración del proyecto</h2><p class="lead">Registra qué se construye, para quién y qué límites no se pueden romper. Estos datos entran al cálculo de todas las alternativas.</p></div>' +
      '<div class="card"><h3>Características y usuarios</h3>' +
      '<label for="pName">Nombre del proyecto<input id="pName" type="text" value="' + esc(p.name) + '"></label>' +
      '<label for="pDesc">Descripción<textarea id="pDesc">' + esc(p.description) + '</textarea></label>' +

  function buildReport(ids) {
    var p = state.proj, ran = state.scenarios.filter(function (s) { return state.runs[s.id] && ids.indexOf(s.id) >= 0; });
    var fecha = new Date().toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' });
    var h = '<div class="rep-head"><h1>' + esc(p.name) + ': informe de simulación de arquitectura</h1><p class="small">Ingeniería Aplicada, Actividad 9 · Tres Felices Tigres, Universidad Libre · ' + esc(fecha) + '</p>' +
      '<p>' + esc(p.description) + '</p><p><b>Usuarios previstos:</b> ' + esc(p.users) + '</p>' +
      '<p><b>Requisitos obligatorios:</b> latencia p95 ≤ ' + nf(p.latMaxMs, 0) + ' ms; disponibilidad ≥ ' + p.availMinPct + ' %; capacidad ≥ demanda pico; costo ≤ ' + nf(p.budgetUsd, 0) + ' USD al mes; esfuerzo ≤ ' + nf(p.teamSize * p.weeksAvail * p.dedication, 1) + ' persona-semanas (' + p.teamSize + ' integrantes × ' + p.weeksAvail + ' semanas × ' + p.dedication + ').</p>' +
      '<p><b>Pesos de decisión:</b> ' + M.WEIGHT_KEYS.map(function (k) { return WLABEL[k] + ' ' + nf(p.weights[k], 2); }).join(', ') + '.</p>' +
      '<p class="small">Los resultados son estimaciones del modelo con los parámetros documentados en el simulador. No son mediciones de rendimiento real.</p></div>';
    ran.forEach(function (s) {
      var e = state.runs[s.id], run = e.run, res = run.results, rec = run.recommendation, v = JSON.parse(e.vars);
      h += '<div class="rep-sc"><h2>Escenario: ' + esc(s.name) + (s.base ? ' (referencia)' : '') + '</h2>' +
        '<p><b>Entradas:</b> ' + Object.keys(M.VARS).map(function (k) { return M.VARS[k].label + ' ' + nf(v[k], v[k] < 1 ? 2 : 1) + ' ' + M.VARS[k].unit; }).join('; ') + (v.selfHost ? '; Overpass propio activado' : '') + '.</p>' +
        '<div class="banner ' + (rec.status === 'ok' ? 'ok' : 'none') + '"><h3>' + recTitle(rec, false) + '</h3>' + rec.text.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</div>' +
        explainEasy(run, e, M.sensitivity(v, p)) +
        (rec.proposal ? '<h3>Ajustes propuestos</h3><ul class="plain">' + rec.proposal.changes.map(function (c) { return '<li>' + esc(c.charAt(0).toUpperCase() + c.slice(1)) + '.</li>'; }).join('') + '</ul>' : '') +
        '<h3>Requisitos obligatorios</h3><div class="tablewrap"><table><thead><tr><th>Requisito</th>' + ARCHS.map(function (k) { return '<th>' + k + ' · ' + P[k].label + '</th>'; }).join('') + '</tr></thead><tbody>' +
        res.A.checks.map(function (c, i) { return '<tr><td>' + esc(c.label) + '</td>' + ARCHS.map(function (k) { var x = res[k].checks[i]; return '<td>' + (x.ok ? 'Cumple' : 'No cumple') + ' (' + (x.key === 'lat' ? ms(x.value) : x.key === 'av' ? nf(x.value, 3) + ' %' : x.key === 'cap' ? nf(x.value, 2) + '×' : x.key === 'cost' ? nf(x.value, 2) + ' USD' : nf(x.value, 0) + ' p-s') + ')</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
        '<h3>Indicadores calculados</h3><div class="tablewrap"><table><thead><tr><th>Indicador</th>' + ARCHS.map(function (k) { return '<th>' + k + '</th>'; }).join('') + '</tr></thead><tbody>' +
        IND.map(function (r) { return '<tr><td>' + r[0] + '</td>' + ARCHS.map(function (k) { return '<td>' + r[3](res[k]) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
        '<div class="rep-chart"><h3>Puntaje de decisión</h3>' + scoreChart(res, p) + '</div>' +
        (rec.reasons.length ? '<h3>Alternativas descartadas</h3><ul class="plain">' + rec.reasons.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    });
    h += '<div class="rep-sc">' + (ran.length < 2 ? '' : '<h2>Comparación entre escenarios</h2><div class="tablewrap"><table><thead><tr><th>Escenario</th><th>Recomendada</th>' + ARCHS.map(function (k) { return '<th class="num">p95 ' + k + '</th>'; }).join('') + ARCHS.map(function (k) { return '<th class="num">Costo ' + k + ' (USD)</th>'; }).join('') + '</tr></thead><tbody>' +
      ran.map(function (s) { var r = state.runs[s.id].run.results, rc = state.runs[s.id].run.recommendation; return '<tr><td>' + esc(s.name) + '</td><td>' + (rc.best ? rc.best + (rc.status === 'ok' ? '' : ' (con ajustes)') : 'ninguna') + '</td>' + ARCHS.map(function (k) { return '<td class="num">' + (r[k].feasible ? '' : '✗ ') + ms(r[k].latencyP95) + '</td>'; }).join('') + ARCHS.map(function (k) { return '<td class="num">' + nf(r[k].cost, 0) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div><p class="small">✗ marca las alternativas que incumplen algún requisito obligatorio.</p>') +
      '<h3>Supuestos y limitaciones</h3><ul class="plain">' + (ran.length ? state.runs[ran[0].id].run.recommendation.assumptions.concat(state.runs[ran[0].id].run.recommendation.limitations) : []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
    return h;
  }
  /* scope: 'one' (escenario indicado) o 'all'. Reejecuta los escenarios cuyas variables cambiaron para que el PDF refleje lo que hay en pantalla. */
  function exportPdf(scope, id, hint) {
    var root = document.documentElement, ids;
    if (scope === 'all') {
      ids = state.scenarios.filter(function (s) { return M.validate(s.vars, state.proj).length === 0; }).map(function (s) { return s.id; });
      ids.forEach(function (x) { if (isStale(x)) runScenario(x); });
    } else {
      var errs = M.validate((scen(id) || {}).vars, state.proj);
      if (errs.length) { if (hint) hint.textContent = 'Corrige los valores inválidos antes de exportar.'; return; }
      if (isStale(id)) runScenario(id);
      ids = [id];
    }
    $('#printReport').innerHTML = buildReport(ids);
    var prevTheme = root.getAttribute('data-theme'), prevTitle = document.title, fired = false;
    var restore = function () { if (prevTheme === null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', prevTheme); document.title = prevTitle; $('#printReport').innerHTML = ''; };
    var onBefore = function () { fired = true; };
    window.addEventListener('beforeprint', onBefore);
    window.addEventListener('afterprint', function done() { window.removeEventListener('afterprint', done); window.removeEventListener('beforeprint', onBefore); restore(); });
    root.setAttribute('data-theme', 'light');
    document.title = scope === 'all' ? 'Locus-simulacion-todos-los-escenarios' : 'Locus-simulacion-' + (scen(id).name || id).replace(/[^A-Za-z0-9]+/g, '-');
    if (hint) hint.textContent = 'En el cuadro de impresión elige «Guardar como PDF».';
    try { window.print(); } catch (e) {}
    setTimeout(function () {
      if (!fired) { restore(); window.removeEventListener('beforeprint', onBefore); if (hint) hint.textContent = 'Esta vista no permite imprimir. Abre el simulador publicado (GitHub Pages o Firebase) y pulsa de nuevo; en el cuadro de impresión elige «Guardar como PDF».'; }
    }, 900);
  }

  /* ---------- 5. Pruebas ---------- */
  function renderPruebas() {
    var res = TS.runAll(M), ok = res.filter(function (r) { return r.pass; }).length;
    $('#v-pruebas').innerHTML =
      '<div><h2>Validación y pruebas</h2><p class="lead">Estas pruebas se ejecutan ahora mismo sobre el mismo modelo que calcula los resultados. El archivo <code>tests.js</code> corre las mismas con Node.</p></div>' +
      '<div class="banner ' + (ok === res.length ? 'ok' : 'none') + '" role="status"><h2>' + ok + ' de ' + res.length + ' pruebas pasan</h2><p>Cubren cálculo manual, monotonía, presupuesto, coherencia de la recomendación, escenarios imposibles, validación de entradas, repetibilidad y sensibilidad a los pesos.</p></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Prueba</th><th>Qué demuestra</th><th>Esperado</th><th>Obtenido</th><th>Resultado</th></tr></thead><tbody>' +
      res.map(function (r) { return '<tr><td><b>' + r.id + '</b> ' + esc(r.name) + '</td><td>' + esc(r.desc) + '</td><td>' + esc(r.expected) + '</td><td>' + esc(r.obtained) + '</td><td><span class="pill ' + (r.pass ? 'ok' : 'bad') + '">' + (r.pass ? 'Pasa' : 'Falla') + '</span></td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="card"><h3>Controles de entradas inválidas</h3><p>Cada campo valida tipo, rango y entero cuando corresponde. Mientras haya un error el botón de ejecutar queda desactivado y el mensaje dice qué corregir. Los pesos no pueden ser negativos ni sumar cero.</p></div>';
  }

  /* ---------- 6. Documentación ---------- */
  function renderDoc() {
    var varsRows = Object.keys(M.VARS).map(function (k) { var d = M.VARS[k]; return '<tr><td><code>' + k + '</code></td><td>' + d.label + '</td><td>' + d.min + ' a ' + d.max + ' ' + d.unit + '</td><td>' + WHY[k] + '</td></tr>'; }).join('');
    var parRows = [
      ['tExtBaseMs', C.tExtBaseMs, 'ms', 'Latencia base de Overpass y Nominatim'], ['tExtPerPoiMs', C.tExtPerPoiMs, 'ms por lugar', 'Tamaño de la respuesta'],
      ['routeUsPerN2', C.routeUsPerN2, 'µs', 'Vecino más cercano O(n²) en servidor'], ['clientCpuFactor', C.clientCpuFactor, '×', 'Teléfono frente a servidor'],
      ['renderMs', C.renderMs, 'ms', 'Pintar el itinerario'], ['cacheReadMs', C.cacheReadMs, 'ms', 'Leer del caché'], ['parseMsPerPoi', C.parseMsPerPoi, 'ms por lugar', 'Interpretar la respuesta del mapa'],
      ['rhoTarget', C.rhoTarget, '', 'Utilización objetivo de servidores'], ['rhoExtTarget', C.rhoExtTarget, '', 'Uso cómodo de la API pública'],
      ['extCapPerIpRps', C.extCapPerIpRps, 'req/s', 'Tolerancia de la API pública por IP'], ['extCapGlobalRps', C.extCapGlobalRps, 'req/s', 'Parte pública que le toca a Locus (clientes directos)'],
      ['selfHostTExtBaseMs / selfHostCapRps / selfHostUsd', C.selfHostTExtBaseMs + ' / ' + C.selfHostCapRps + ' / ' + C.selfHostUsd, 'ms / req/s / USD', 'Overpass propio: consulta base, capacidad y costo mensual'], ['rateLimitPerIpPerMin', C.rateLimitPerIpPerMin, 'req/min', 'Umbral del error 429 por usuario'], ['rateLimitBackoffMs', C.rateLimitBackoffMs, 'ms', 'Espera tras un 429'],
      ['localCacheFactor (A)', P.A.localCacheFactor, '', 'Aciertos del caché solo en el teléfono frente a uno compartido'],
      ['extAvail', C.extAvail, '', 'Disponibilidad de los espejos de Overpass'], ['dbAvail / hostingAvail', C.dbAvail, '', 'Firestore y Hosting'], ['instAvail', C.instAvail, '', 'Una instancia de servidor'],
      ['minReplicas', C.minReplicas, '', 'Réplicas mínimas por servicio si el presupuesto alcanza'], ['dutyHoursPerDay', C.dutyHoursPerDay, 'h', 'Horas al día a la carga simulada'],
      ['freeOpsPerMonth', C.freeOpsPerMonth, 'ops', 'Cuota gratuita de Firestore'], ['usdPerMillionOps', C.usdPerMillionOps, 'USD', 'Costo por millón de operaciones'], ['opsPerRequest', C.opsPerRequest, 'ops', 'Operaciones de Firestore por solicitud'],
      ['p95Queue / p95Ext / p95Ramp', C.p95Queue + ' / ' + C.p95Ext + ' / ' + C.p95Ramp, '', 'Factores del percentil 95']
    ].map(function (r) { return '<tr><td><code>' + r[0] + '</code></td><td class="num">' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>'; }).join('');
    $('#v-documentacion').innerHTML =
      '<div><h2>Documentación del simulador</h2><p class="lead">Describe el modelo, las variables, las fórmulas, los criterios de decisión, el uso y las limitaciones.</p></div>' +
      '<div class="card"><h3>Enlace al simulador</h3><div class="copy"><code id="selfUrl"></code><button class="btn" id="copyUrl" type="button">Copiar enlace</button><span class="small" id="copyMsg" role="status"></span></div></div>' +
      '<div class="card"><h2>1. Descripción del modelo</h2><p>El simulador compara tres arquitecturas para Locus (cliente directo, monolito con caché y microservicios) con las mismas entradas. Para cada una calcula la demanda, reparte instancias según el presupuesto, estima cola, latencia, capacidad, disponibilidad y costo, verifica cinco requisitos obligatorios y puntúa las que cumplen con los pesos del equipo.</p>' +
      '<p>La parte dominante del tiempo de respuesta es la consulta a OpenStreetMap, y la diferencia entre arquitecturas está en cuánta de esa consulta evitan mediante caché, cuánta capacidad tienen para atender la demanda y qué cuestan.</p></div>' +
      '<div class="card"><h2>2. Variables de entrada</h2><div class="tablewrap"><table><thead><tr><th>Variable</th><th>Significado</th><th>Rango válido</th><th>Relación con requisitos y resultados</th></tr></thead><tbody>' + varsRows + '</tbody></table></div><p class="small">Además se configuran en la pestaña Proyecto: latencia máxima, disponibilidad mínima, presupuesto, equipo, semanas, dedicación y pesos.</p></div>' +
      '<div class="card"><h2>3. Fórmulas</h2><pre>' + esc(
'Demanda\n  λ = usuarios × solicitudes_por_minuto / 60                         [req/s]\n  aciertos efectivos h = aciertos (B, C)  |  aciertos × 0.35 (A)\n  λ_ext = λ × (1 − h)\n\n' +
'Servicios (B y C)\n  D = base + porLugar·n [+ ruta n²·2µs] [+ (1−h)·0.4·n + h·2]       [ms por solicitud]\n  instancias k = clamp( máx( ⌈λ·D/1000/0.7⌉, ⌈λ_ext/(8·0.5)⌉ si sale a OSM, 2 ), 1, máx_k )\n  si costo > presupuesto: quitar una instancia al servicio con más réplicas, hasta cumplir\n  ρ = λ·D / (k·1000)        R = D / (1 − ρ)        (M/M/1 por servicio)\n\n' +
'API externa\n  capacidad = k_salida × 8 req/s (B, C)  |  40 req/s (A)\n  T_ext = 900 + 25·n  (300 + 25·n con Overpass propio, capacidad 60 req/s, +30 USD)\n  u = λ_ext / capacidad        T_ext_ef = T_ext × (1 + u / (2(1−u)))   (M/D/1)\n\n' +
'Latencia\n  B, C: media = RTT + saltos + render + ΣR + (1−h)·T_ext_ef\n        p95   = RTT + saltos + render + 3·ΣR + 1.5·rampa·T_ext_ef,  rampa = mín(1, (1−h)/0.05)\n  A:    media = ruta_en_teléfono + render + h·2 + (1−h)·(RTT + T_ext_ef + P429·2000)\n        p95   = ruta + render + RTT + 1.5·rampa·T_ext_ef + mín(1, P429/0.05)·2000\n        P429 = máx(0, mín(1, (solicitudes_por_min − 6)/6))\n\n' +
'Capacidad y escalabilidad\n  capacidad = mín( mín_s k_s·0.7·1000/D_s , 0.5·capacidad_ext/(1−h) )     margen = capacidad / λ\n  escalabilidad = techo técnico (con máx_k instancias) / λ\n\n' +
'Disponibilidad\n  Disp = hosting × Firestore × Π_s (1 − (1−0.995)^k_s) × [broker 0.999 en C] × (1 − (1−0.99)(1−h))\n\n' +
'Costo\n  costo = fijo + Σ k_s × precio_s + máx(0, ops_mes − 600 000)/10⁶ × 0.9\n  ops_mes = λ × 3600 × 3 h × 30 días × 0.2\n') + '</pre></div>' +
      '<div class="card"><h2>4. Parámetros y supuestos</h2><div class="tablewrap"><table><thead><tr><th>Parámetro</th><th class="num">Valor</th><th>Unidad</th><th>Qué representa</th></tr></thead><tbody>' + parRows + '</tbody></table></div>' +
      '<ul class="plain"><li>Todos los valores son supuestos del equipo basados en el comportamiento típico de las APIs públicas y de los artículos del curso. No son mediciones.</li><li>Las solicitudes llegan de forma uniforme durante las horas simuladas.</li><li>Cada instancia de servidor tiene su propia IP de salida.</li><li>Los esfuerzos de desarrollo (6, 10 y 24 persona-semanas) son estimaciones del equipo.</li></ul></div>' +
      '<div class="card"><h2>5. Criterios de decisión</h2><ol class="plain"><li><b>Requisitos obligatorios.</b> Se descarta toda alternativa que incumpla: latencia p95 máxima, disponibilidad mínima, capacidad para la demanda pico (margen ≥ 1), costo dentro del presupuesto y esfuerzo dentro de la capacidad del equipo.</li><li><b>Puntaje 0 a 1 por criterio.</b> Latencia: 1 − p95/límite. Disponibilidad: log₁₀(indisponibilidad permitida / indisponibilidad calculada)/1.5. Costo: 1 − costo/presupuesto. Escalabilidad: log₂(techo/demanda)/4. Simplicidad: 1 − esfuerzo/capacidad del equipo. Todos limitados a [0, 1].</li><li><b>Suma ponderada</b> con los pesos normalizados del equipo. Gana el mayor puntaje entre las que cumplen. Si ninguna cumple, el simulador busca la propuesta que menos cambia el plan, probando en este orden de esfuerzo: servidor propio de OpenStreetMap (Overpass autoalojado), precalentar el caché (+0.20 o +0.35 de aciertos), subir el presupuesto (×1.25 a ×5) y ampliar el plazo (×1.5 a ×3). Cada combinación se vuelve a simular y se elige la primera donde alguna alternativa cumple los 5 requisitos. Si ni con todos los ajustes al máximo alcanza, propone limitar los usuarios simultáneos con una sala de espera y calcula el límite. Solo si el requisito es imposible incluso con un usuario (por ejemplo, 200 ms de latencia) se indica cuál se acerca más y qué requisito falla.</li></ol></div>' +
      '<div class="card"><h2>6. Instrucciones de uso</h2><ol class="plain"><li>En Proyecto, revisa los requisitos, el presupuesto, el equipo y los pesos.</li><li>En Escenarios, ajusta el escenario de referencia y los demás, o crea uno nuevo.</li><li>Pulsa «Ejecutar todos los escenarios».</li><li>En Resultados, lee la recomendación, la tabla de requisitos, los indicadores y los gráficos. Usa el barrido para ver el punto donde cambia la decisión.</li><li>Abre la trazabilidad para verificar cualquier número con su fórmula.</li><li>En Pruebas, comprueba que el modelo se comporta de forma coherente.</li></ol></div>' +
      '<div class="card"><h2>7. Limitaciones</h2><ul class="plain"><li>Los resultados son estimaciones del modelo, no mediciones de rendimiento real.</li><li>No hay picos dentro del minuto, fallas correlacionadas ni diferencias entre proveedores de nube.</li><li>Un monolito en una sola máquina suele superar a los microservicios en rendimiento puro, según los artículos, y el resultado no se generaliza a todos los sistemas.</li><li>El modelo supone que la API pública de OSM se comporta igual en todo el día.</li><li>La seguridad y el cifrado no se modelan como indicador.</li></ul>' +
      '<h3>Información adicional para validar en una aplicación real</h3><ul class="plain"><li>Latencias y tasas de error reales de Overpass, Nominatim y Open-Elevation, medidas desde Colombia.</li><li>Tasa real de aciertos de caché con usuarios reales.</li><li>Precios actuales del proveedor y consumo real de Firestore.</li><li>Pruebas de carga con JMeter o k6 sobre un prototipo de cada alternativa.</li></ul></div>' +
      '<div class="card"><h2>8. Guion de sustentación</h2><div class="step"><b>1</b><p>Muestra la pestaña Proyecto y explica los requisitos obligatorios.</p></div><div class="step"><b>2</b><p>En Escenarios, ejecuta los cuatro. Señala que cada resultado sale del cálculo.</p></div><div class="step"><b>3</b><p>Cambia una variable, por ejemplo sube los usuarios de la temporada alta, y vuelve a ejecutar.</p></div><div class="step"><b>4</b><p>Lee la recomendación y abre la trazabilidad para mostrar la fórmula con números.</p></div><div class="step"><b>5</b><p>Usa el barrido y la sensibilidad para explicar cuándo cambiaría la decisión.</p></div></div>' +
      '<div class="card"><h2>9. Referencias</h2><ul class="plain"><li>From Monolithic Systems to Microservices: A Comparative Study of Performance.</li><li>Monolithic vs. Microservice Architecture: A Performance and Scalability Evaluation.</li><li>A Comparative Review of Microservices and Monolithic Architectures.</li><li>MVC Architecture: A Comparative Study Between Laravel Framework and Slim Framework in Freelancer Project Monitoring System Web Based.</li></ul></div>';
    var url = ''; try { url = location.href.split('#')[0]; } catch (e) {}
    $('#selfUrl').textContent = url || '(abre el simulador desde su enlace publicado)';
    $('#copyUrl').onclick = function () {
      var m = $('#copyMsg');
      try { navigator.clipboard.writeText(url).then(function () { m.textContent = 'Enlace copiado'; }, function () { sel(); }); } catch (e) { sel(); }
      function sel() { var r = document.createRange(); r.selectNodeContents($('#selfUrl')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); m.textContent = 'Enlace seleccionado, cópialo con el menú'; }
    };
  }

  /* ---------- tema e inicio ---------- */
  function initTheme() {
    var b = $('#themeBtn'), root = document.documentElement;
    var cur = function () { var t = root.getAttribute('data-theme'); if (t) return t; return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; };
    var label = function () { b.textContent = cur() === 'dark' ? 'Tema claro' : 'Tema oscuro'; };
    b.onclick = function () { root.setAttribute('data-theme', cur() === 'dark' ? 'light' : 'dark'); label(); };
    label();
  }
  load(); buildTabs(); initTheme();
  $('#pager').addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (b) go(b.dataset.v); });
  var h = (location.hash || '').replace('#', '');
  var start = VIEWS.some(function (v) { return v[0] === h; }) ? h : 'proyecto';
  go(start, true);
  window.addEventListener('hashchange', function () { var x = (location.hash || '').replace('#', ''); if (VIEWS.some(function (v) { return v[0] === x; }) && x !== state.view) go(x, true); });
})();
</script>
