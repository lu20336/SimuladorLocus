<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador Locus</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Concepto: herramienta de análisis sobria con la identidad de Locus (azul marino, verde azulado, coral solo para la acción principal). */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface2:#EEF2F6; --ink:#12263F; --muted:#56687F; --line:#D5DDE6;
  --navy:#003366; --teal:#00796F; --cta:#E8484E; --cta-ink:#FFFFFF;
  --cA:#C85A14; --cB:#00796F; --cC:#5256C8;
  --ok:#17794A; --ok-bg:#DDF3E7; --bad:#B42331; --bad-bg:#FBE1E3; --warn:#8A5A00; --warn-bg:#FCEFCC;
  --focus:#1E6FD9;
  --f-display:'Fraunces',Georgia,serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1828; --surface:#13243A; --surface2:#1A2E48; --ink:#E7EDF5; --muted:#9DB0C6; --line:#27405F;
  --navy:#7FB2E8; --teal:#34C3B4; --cta:#FF6A6F; --cta-ink:#1A0A0B;
  --cA:#F09A5C; --cB:#34C3B4; --cC:#A3A7FF;
  --ok:#5FD392; --ok-bg:#173B2B; --bad:#FF8791; --bad-bg:#47202A; --warn:#F2C25B; --warn-bg:#40330F; --focus:#7DB4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1828; --surface:#13243A; --surface2:#1A2E48; --ink:#E7EDF5; --muted:#9DB0C6; --line:#27405F;
  --navy:#7FB2E8; --teal:#34C3B4; --cta:#FF6A6F; --cta-ink:#1A0A0B;
  --cA:#F09A5C; --cB:#34C3B4; --cC:#A3A7FF;
  --ok:#5FD392; --ok-bg:#173B2B; --bad:#FF8791; --bad-bg:#47202A; --warn:#F2C25B; --warn-bg:#40330F; --focus:#7DB4FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:26px} h2{font-size:21px} h3{font-size:16px;font-family:var(--f-body);font-weight:600;color:var(--ink)}
p{margin:0;max-width:68ch} a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:20px;padding-block:20px}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.brand h1{font-size:21px}
.navgroup{display:flex;flex-direction:column;gap:4px}
.navgroup+.navgroup{margin-top:14px}
.navlabel{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 12px 4px}
.tab{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:500;text-align:left;min-height:46px;width:100%}
.tab:hover{background:var(--surface2)}
.tab .ic{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface)}
.tab .ic svg{width:16px;height:16px}
.tab .lbl{flex:1;min-width:0}
.tab .lbl .short{display:none}
.tab .badge{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--surface2);color:var(--muted)}
.tab .badge.warn{background:var(--warn-bg);color:var(--warn)}
.tab[aria-selected="true"]{background:var(--navy);color:var(--bg)}
.tab[aria-selected="true"] .ic{background:var(--bg);border-color:var(--bg);color:var(--navy)}
.tab[aria-selected="true"] .badge{background:rgba(255,255,255,.22);color:inherit}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;white-space:nowrap;min-height:44px;width:100%}
.content{min-width:0;padding-block:20px 8px;display:flex;flex-direction:column;gap:24px}
.easy{border-color:var(--teal)}
.easy-sum{font-size:16px;line-height:1.55;max-width:75ch}
.easy-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:14px;max-width:80ch}
.easy-steps>li::marker{font-weight:700;color:var(--teal)}
.easy-steps ul{margin-top:8px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.pager .btn{display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1.3;min-width:150px}
.pager .btn small{font-weight:400;color:var(--muted);font-size:12px}
.pager .next{align-items:flex-end;margin-left:auto}
.view{display:none;gap:20px;flex-direction:column}
.view.on{display:flex}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid>*{min-width:0}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
label .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical;min-height:84px}
input[type=range]{width:100%;accent-color:var(--teal);min-height:32px}
.btn{border:1px solid var(--navy);background:transparent;color:var(--navy);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.errors{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 14px;font-size:13px}
.errors ul{margin:0;padding-left:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.best{font-weight:700;color:var(--ok)}
.tag{font-family:var(--f-mono);font-weight:500;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--bg);font-size:13px}
.tA{background:var(--cA)} .tB{background:var(--cB)} .tC{background:var(--cC)}
.banner{border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface)}
.banner.ok{border-color:var(--ok);background:var(--ok-bg)} .banner.none{border-color:var(--warn);background:var(--warn-bg)}
.banner h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.flow span.node{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.flow span.arrow{color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.cols2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.small{font-size:13px;color:var(--muted)}
.stale{margin-left:6px}
pre{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);border-radius:8px;padding:12px;overflow-x:auto;margin:0;line-height:1.6}
code{font-family:var(--f-mono);font-size:.92em;background:var(--surface2);padding:1px 5px;border-radius:4px}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
svg text{fill:var(--ink);font-family:var(--f-body)}
svg .muted{fill:var(--muted)}
.chartbox{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.vcard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.vcard .why{font-size:13px;color:var(--muted)}
.vcard .ctrl{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr);gap:12px;align-items:center}
.delta{font-size:12px;color:var(--muted)}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy code{overflow-wrap:anywhere}
.step{display:flex;gap:12px}
.step b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--bg);display:grid;place-items:center;font-size:13px}
#printReport{display:none}
.hint-pdf{font-size:13px}
@media print{
  @page{size:A4;margin:14mm}
  body{padding:0!important;background:#fff!important;color:#111!important;font-size:11.5px}
  body::before{display:none!important}
  .wrap>*:not(#printReport){display:none!important}
  #printReport{display:block}
  #printReport h1{font-size:20px} #printReport h2{font-size:15px;margin-top:6px} #printReport h3{font-size:12.5px}
  .rep-sc{break-before:page;display:flex;flex-direction:column;gap:10px}
  .rep-head+.rep-sc{break-before:auto}
  #printReport h2,#printReport h3{break-after:avoid}
  .rep-chart{break-inside:avoid}
  .docprint{display:flex;flex-direction:column;gap:8px} .docprint .card{border:0;padding:0;gap:6px;background:none} .docprint h2{font-size:14px;margin-top:10px} .docprint p,.docprint li{font-size:11px;line-height:1.45} .docprint .tablewrap{border-radius:0} .docprint tr{break-inside:avoid} .docprint pre{white-space:pre-wrap;overflow-wrap:anywhere;overflow:visible;font-size:9.5px;line-height:1.45} .docprint ol,.docprint ul{break-inside:auto}
  #printReport,#printReport *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rep-head{display:flex;flex-direction:column;gap:8px}
  #printReport table{font-size:10.5px} #printReport th,#printReport td{padding:5px 8px}
  .tablewrap{overflow:visible;border-radius:0}
  .banner{break-inside:avoid} svg{max-width:100%!important;min-width:0!important;height:auto}
}
@media (max-width:900px){
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:static;padding-block:14px 0;gap:12px}
  .brand h1{font-size:20px}
  .side .iconbtn{width:auto;align-self:flex-start;padding:8px 14px;min-height:40px}
  .navlabel{display:none}
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  #tabs .navgroup{display:contents}
  .navgroup+.navgroup{margin-top:0}
  .tab{flex-direction:column;gap:3px;padding:6px 2px;text-align:center;font-size:11px;min-height:56px;justify-content:center;border-radius:8px}
  .tab .lbl .long{display:none} .tab .lbl .short{display:inline}
  .tab .lbl{flex:none}
  .tab .ic{width:26px;height:26px}
  .tab .badge{position:absolute;top:2px;right:6px;font-size:10px;padding:0 6px}
  .tab{position:relative}
  .content{padding-top:12px}
}
@media (max-width:520px){h1{font-size:22px}.card{padding:14px}.vcard .ctrl{grid-template-columns:1fr}}

/* ---- mejoras UI/UX ---- */
.skip{position:absolute;left:-9999px;top:8px;background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:100;font-weight:600}
.skip:focus{left:12px}
.sidefoot{margin-top:auto;padding:14px 12px 4px;font-size:12px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line)}
.sidefoot b{color:var(--ink);font-weight:600}
.hero{border-color:var(--teal);border-width:1.5px;gap:12px}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:700}
.hero-main{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-main .tag{width:38px;height:38px;font-size:19px;border-radius:9px}
.hero-name{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--navy);line-height:1.15}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi span{font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.fact b{font-size:16px;font-variant-numeric:tabular-nums}
.fact span{font-size:11px;line-height:1.3;color:var(--muted)}
details.svc>summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--navy);padding:4px 0}
details.svc .tablewrap{margin-top:8px}
details.svc table{font-size:12.5px} details.svc th,details.svc td{padding:7px 9px}
.wpill{display:inline-block;align-self:flex-start;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--teal);font-weight:700;font-size:12.5px}
@media (max-width:899px){.sidefoot{display:none}}
@media (max-width:600px){th{white-space:normal;font-size:11px;letter-spacing:.02em} th,td{padding:8px 8px} .hero-name{font-size:23px}}

/* ---- pruebas ---- */
.tests-empty{flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap;border-style:dashed}
.tests-empty>div:nth-child(2){flex:1 1 280px}
.tests-empty p{color:var(--muted);margin-top:4px}
.te-ic{width:48px;height:48px;border-radius:50%;background:var(--surface2);color:var(--teal);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.thero{flex-direction:row;align-items:center;gap:22px;flex-wrap:wrap;border-width:1.5px}
.thero.good{border-color:var(--ok);background:linear-gradient(135deg,var(--ok-bg),var(--surface) 70%)}
.thero.warn{border-color:var(--warn);background:linear-gradient(135deg,var(--warn-bg),var(--surface) 70%)}
.thero-txt{flex:1 1 300px;display:flex;flex-direction:column;gap:8px;min-width:0}
.thero-txt h3{font-family:var(--f-display);font-size:26px;color:var(--navy);line-height:1.2}
.ring{width:132px;height:132px;flex:none}
.tgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr))}
.tgroup{gap:10px}
.tgroup.good{border-top:3px solid var(--ok)} .tgroup.warn{border-top:3px solid var(--bad)}
.tg-top{display:flex;justify-content:space-between;align-items:center}
.tbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tgroup.warn .tbar i{background:var(--bad)}
.tanalysis h4{font-size:14px;margin-bottom:6px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.titem{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.titem.bad{border-color:var(--bad)}
.titem>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
.titem>summary::-webkit-details-marker{display:none}
.titem>summary:hover{background:var(--surface2)}
.tmark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--ok-bg);color:var(--ok)}
.titem.bad .tmark{background:var(--bad-bg);color:var(--bad)}
.tname{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tname small{color:var(--muted);font-size:12.5px;line-height:1.4}
.tbody{padding:4px 14px 14px 52px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.tcmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tcmp>div{background:var(--surface2);border-radius:8px;padding:10px 12px}
.tcmp span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tcmp p{margin-top:2px;overflow-wrap:anywhere}
@media (max-width:600px){.tbody{padding-left:14px}.ring{width:110px;height:110px}.thero-txt h3{font-size:21px}}

/* ---- simulación en vivo ---- */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tlcard{gap:12px}
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:0}
.tl-s{position:relative;min-width:0}
.tl-s::before{content:"";position:absolute;top:21px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.tl-s:first-child::before{display:none}
.tl-s.done::before,.tl-s.warn::before,.tl-s.error::before,.tl-s.current::before{background:var(--teal)}
.tl-b{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;cursor:pointer;padding:0 4px 6px;color:var(--ink);text-align:center;border-radius:10px;min-height:44px}
.tl-b:hover{background:var(--surface2)}
.tl-b[aria-pressed="true"]{background:var(--surface2)}
.tl-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--surface);border:3px solid var(--line);color:var(--muted)}
.tl-s.done .tl-ic{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.tl-s.warn .tl-ic{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.tl-s.error .tl-ic{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.tl-s.current .tl-ic{background:var(--navy);border-color:var(--navy);color:var(--bg);animation:tlpulse 1.4s ease-in-out infinite}
.tl-s.skipped .tl-ic{border-style:dashed}
.tl-n{font-size:13px;font-weight:600;line-height:1.25;display:flex;flex-direction:column;align-items:center}
.tl-n small{font-size:10.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tl-t{font-size:11.5px;color:var(--muted)}
.tl-s.done .tl-t{color:var(--ok)} .tl-s.warn .tl-t{color:var(--warn)} .tl-s.error .tl-t{color:var(--bad)} .tl-s.current .tl-t{color:var(--navy);font-weight:700}

         ] }
  };
  const ARCHS = ['A', 'B', 'C'];

  /* ---------- Variables y validación ---------- */
  const VARS = {
    users:     { label: 'Usuarios simultáneos en el pico', unit: 'usuarios', min: 10, max: 5000, int: true, step: 10 },
    reqPerMin: { label: 'Solicitudes por usuario',        unit: 'por minuto', min: 0.5, max: 10, step: 0.5 },
    hit:       { label: 'Aciertos de caché',              unit: 'fracción', min: 0, max: 0.95, step: 0.05 },
    rtt:       { label: 'Latencia de red del celular',    unit: 'ms', min: 20, max: 1000, step: 10 },
    pois:      { label: 'Lugares por itinerario',         unit: 'lugares', min: 5, max: 40, int: true, step: 1 }
  };
  const PROJECT_FIELDS = {
    latMaxMs:   { label: 'Latencia máxima (p95)', min: 200, max: 60000 },
    availMinPct:{ label: 'Disponibilidad mínima (%)', min: 90, max: 99.999 },
    budgetUsd:  { label: 'Presupuesto mensual (USD)', min: 0, max: 100000 },
    teamSize:   { label: 'Integrantes del equipo', min: 1, max: 30, int: true },
    weeksAvail: { label: 'Semanas disponibles', min: 1, max: 104 },
    dedication: { label: 'Dedicación al proyecto', min: 0.05, max: 1 }
  };
  const WEIGHT_KEYS = ['lat', 'av', 'cost', 'scal', 'simp'];

  function defaultProject() {
    return {
      name: 'Locus',
      description: 'Plataforma web que arma itinerarios de viaje por Colombia con datos de OpenStreetMap, ordena las paradas por cercanía y guarda el plan en Firebase.',
      users: 'Turistas que planean un viaje a un destino nuevo en Colombia, desde un celular y con conexión móvil variable.',
      latMaxMs: 5000, availMinPct: 99, budgetUsd: 120,
      teamSize: 3, weeksAvail: 12, dedication: 0.5,
      weights: { lat: 0.25, av: 0.2, cost: 0.2, scal: 0.15, simp: 0.2 }
    };
  }
  function defaultScenarios() {
    return [
      { id: 'ref', name: 'Referencia: piloto', base: true, vars: { users: 50, reqPerMin: 2, hit: 0.4, rtt: 80, pois: 20 } },
      { id: 'alta', name: 'Temporada alta', vars: { users: 600, reqPerMin: 3, hit: 0.6, rtt: 120, pois: 25 } },
      { id: 'viral', name: 'Se hace viral', vars: { users: 3000, reqPerMin: 3, hit: 0.9, rtt: 150, pois: 30, selfHost: true } },
      { id: 'rural', name: 'Red móvil rural', vars: { users: 150, reqPerMin: 2, hit: 0.3, rtt: 450, pois: 20 } }
    ];
  }

  function validate(v, proj) {
    const errs = [];
    const chk = (val, def, label) => {
      if (typeof val !== 'number' || !isFinite(val)) { errs.push(label + ': escribe un número.'); return; }
      if (val < def.min || val > def.max) errs.push(label + ': debe estar entre ' + def.min + ' y ' + def.max + '.');
      else if (def.int && !Number.isInteger(val)) errs.push(label + ': debe ser un número entero.');
    };
    if (v) Object.keys(VARS).forEach(k => chk(v[k], VARS[k], VARS[k].label));
    if (v && v.selfHost !== undefined && typeof v.selfHost !== 'boolean') errs.push('Overpass propio: debe ser sí o no.');
    if (proj) {
      Object.keys(PROJECT_FIELDS).forEach(k => chk(proj[k], PROJECT_FIELDS[k], PROJECT_FIELDS[k].label));
      const w = proj.weights || {};
      let sum = 0, ok = true;
      WEIGHT_KEYS.forEach(k => { if (typeof w[k] !== 'number' || !isFinite(w[k]) || w[k] < 0) ok = false; else sum += w[k]; });
      if (!ok) errs.push('Pesos de decisión: usa números mayores o iguales a 0.');
      else if (sum <= 0) errs.push('Pesos de decisión: al menos un peso debe ser mayor que 0.');
    }
    return errs;
  }

  /* ---------- Utilidades ---------- */
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const fmt = (x, d) => (Math.round(x * Math.pow(10, d || 0)) / Math.pow(10, d || 0)).toString();
  function routeMs(n, c, factor) { return n * n * c.routeUsPerN2 / 1000 * (factor || 1); }
  function tExt(n, c) { return c.tExtBaseMs + c.tExtPerPoiMs * n; }
  function demandMs(s, n, H, c) {
    let d = s.base + s.perPoi * n;
    if (s.route) d += routeMs(n, c);
    if (s.cache) d += (1 - H) * c.parseMsPerPoi * n + H * c.cacheReadMs;
    return d;
  }
  function md1(u, c) { const x = Math.min(u, c.rhoMax); return 1 + x / (2 * (1 - x)); }

  /* Reparto de instancias: cubre la demanda con utilización objetivo, mantiene réplicas mínimas
     y recorta (quitando de la que más tiene) cuando el costo supera el presupuesto. */
  function allocate(svcs, fixedAndUsage, budget, lambda, H, n, c, sh) {
    const inst = svcs.map(s => {
      const dem = demandMs(s, n, H, c);
      let needed = Math.ceil((lambda * dem / 1000) / c.rhoTarget);
      if (s.egress && !sh) needed = Math.max(needed, Math.ceil((lambda * (1 - H)) / (c.extCapPerIpRps * c.rhoExtTarget)));
      return Math.max(1, Math.min(s.maxInst, Math.max(needed, c.minReplicas)));
    });
    const cost = () => fixedAndUsage + svcs.reduce((a, s, i) => a + inst[i] * s.costUsd, 0);
    while (cost() > budget) {
      let idx = -1, best = 1;
      inst.forEach((k, i) => { if (k > best) { best = k; idx = i; } });
      if (idx < 0) break;
      inst[idx]--;
    }
    return inst;
  }

  /* ---------- Cálculo de una arquitectura ---------- */
  function computeArch(arch, v, proj, P) {
    P = P || PARAMS;
    const c = P.common, a = P[arch];
    const n = v.pois, H = v.hit, rtt = v.rtt;
    const lambda = v.users * v.reqPerMin / 60;
    const monthlyReq = lambda * 3600 * c.dutyHoursPerDay * c.daysPerMonth;
    const usage = Math.max(0, monthlyReq * c.opsPerRequest - c.freeOpsPerMonth) / 1e6 * c.usdPerMillionOps;
    const hitEff = arch === 'A' ? H * a.localCacheFactor : H;
    const lambdaExt = lambda * (1 - hitEff);
    const sh = !!v.selfHost;
    const tE = sh ? c.selfHostTExtBaseMs + c.tExtPerPoiMs * n : tExt(n, c);
    const trace = [];
    const T = (k, f, val) => trace.push({ k: k, f: f, v: val });
    T('λ (req/s)', 'usuarios × solicitudes por minuto / 60 = ' + v.users + ' × ' + v.reqPerMin + ' / 60', fmt(lambda, 2));
    T('Aciertos efectivos', arch === 'A' ? 'caché local = aciertos × ' + a.localCacheFactor + ' (solo el propio teléfono)' : 'caché compartido = aciertos', fmt(hitEff, 3));
    T('λ externa (req/s)', 'λ × (1 − aciertos efectivos)', fmt(lambdaExt, 2));
    T('T_ext (ms)', (sh ? c.selfHostTExtBaseMs + ' (Overpass propio)' : c.tExtBaseMs) + ' + ' + c.tExtPerPoiMs + ' × ' + n + ' lugares', fmt(tE, 0));

    const svcs = a.services;
    const shCost = sh ? c.selfHostUsd : 0;
    const inst = allocate(svcs, a.fixedUsd + usage + shCost, proj.budgetUsd, lambda, H, n, c, sh);
    const serviceRows = svcs.map((s, i) => {
      const D = demandMs(s, n, H, c);
      const rho = lambda * D / 1000 / inst[i];
      const R = D / (1 - Math.min(rho, c.rhoMax));
      return { key: s.key, name: s.name, inst: inst[i], D: D, rho: rho, R: R,
               cap: inst[i] * c.rhoTarget * 1000 / D, capMax: s.maxInst * c.rhoTarget * 1000 / D, avail: 1 - Math.pow(1 - c.instAvail, inst[i]) };
    });
    serviceRows.forEach(r => {
      T('Servicio «' + r.name + '»', 'D = ' + fmt(r.D, 2) + ' ms; ρ = λ·D/(k·1000) = ' + fmt(lambda, 2) + '×' + fmt(r.D, 2) + '/(' + r.inst + '×1000) = ' + fmt(r.rho, 3) + '; R = D/(1−ρ)', fmt(r.R, 2) + ' ms');
    });

    // capacidad de la API externa
    let egressInst = 0, extCap, extCapMax;
    if (sh) { extCap = c.selfHostCapRps; extCapMax = c.selfHostCapRps; egressInst = arch === 'A' ? 0 : inst[svcs.findIndex(s => s.egress)]; }
    else if (arch === 'A') { extCap = c.extCapGlobalRps; extCapMax = c.extCapGlobalRps; }
    else {
      const eIdx = svcs.findIndex(s => s.egress);
      egressInst = inst[eIdx];
      extCap = egressInst * c.extCapPerIpRps;
      extCapMax = svcs[eIdx].maxInst * c.extCapPerIpRps;
    }
    const uExt = lambdaExt / extCap;
    const tExtEff = tE * md1(uExt, c);
    T('Uso de la API externa', 'λ externa / capacidad = ' + fmt(lambdaExt, 2) + ' / ' + fmt(extCap, 1), fmt(uExt, 3));
    T('T_ext efectivo (ms)', 'T_ext × (1 + u / (2(1−u)))', fmt(tExtEff, 0));

    // latencia
    let mean, p95, fixed, queue = serviceRows.reduce((s, r) => s + r.R, 0), pRL = 0;
    const ramp = Math.min(1, (1 - hitEff) / c.p95Ramp);
    if (arch === 'A') {
      pRL = sh ? 0 : clamp((v.reqPerMin - c.rateLimitPerIpPerMin) / c.rateLimitPerIpPerMin, 0, 1);
      fixed = routeMs(n, c, c.clientCpuFactor) + c.renderMs;
      mean = fixed + hitEff * c.cacheReadMs + (1 - hitEff) * (rtt + tExtEff + pRL * c.rateLimitBackoffMs);
      p95 = fixed + rtt + c.p95Ext * ramp * tExtEff + Math.min(1, pRL / 0.05) * c.rateLimitBackoffMs;
      T('P(429) por IP', 'máx(0, mín(1, (r − ' + c.rateLimitPerIpPerMin + ') / ' + c.rateLimitPerIpPerMin + '))', fmt(pRL, 3));
    } else {
      const hops = a.hops, hopMs = (a.hopBaseMs || 0) + (a.hopPerPoiMs || 0) * n;
      fixed = rtt + hops * hopMs + c.renderMs;
      mean = fixed + queue + (1 - hitEff) * tExtEff;
      p95 = fixed + c.p95Queue * queue + c.p95Ext * ramp * tExtEff;
      if (hops) T('Saltos entre servicios', hops + ' × (' + a.hopBaseMs + ' + ' + a.hopPerPoiMs + ' × ' + n + ')', fmt(hops * hopMs, 1) + ' ms');
    }
    T('Latencia media (ms)', arch === 'A' ? 'ruta en el teléfono + render + (1−h)(RTT + T_ext efectivo + 429)' : 'RTT + saltos + render + Σ R + (1−h)·T_ext efectivo', fmt(mean, 0));
    T('Latencia p95 (ms)', arch === 'A' ? 'fijo + RTT + ' + c.p95Ext + ' × rampa × T_ext efectivo + reintento' : 'fijo + ' + c.p95Queue + ' × Σ R + ' + c.p95Ext + ' × rampa × T_ext efectivo', fmt(p95, 0));

    // capacidad
    const capExtSustainable = c.rhoExtTarget * extCap / (1 - hitEff);
    const capCpu = serviceRows.length ? Math.min.apply(null, serviceRows.map(r => r.cap)) : Infinity;
    const capacity = Math.min(capCpu, capExtSustainable);
    const headroom = capacity / lambda;
    const ceilExt = c.rhoExtTarget * extCapMax / (1 - hitEff);
    const ceilCpu = serviceRows.length ? Math.min.apply(null, serviceRows.map(r => r.capMax)) : Infinity;
    const ceiling = Math.min(ceilCpu, ceilExt);
    const scal = ceiling / lambda;
    T('Capacidad sostenible (req/s)', 'mín(capacidad de servidores, ' + c.rhoExtTarget + ' × capacidad externa / (1−h))', fmt(capacity, 1));
    T('Margen de capacidad', 'capacidad / λ', fmt(headroom, 2) + '×');
    T('Escalabilidad', 'techo técnico (instancias máximas) / λ = ' + fmt(ceiling, 1) + ' / ' + fmt(lambda, 2), fmt(scal, 2) + '×');

    // disponibilidad
    let avSvc = 1;
    serviceRows.forEach(r => { avSvc *= r.avail; });
    const avBroker = arch === 'C' ? 0.999 : 1;
    const avExt = 1 - (1 - (sh ? 0.995 : c.extAvail)) * (1 - hitEff);
    const avail = c.hostingAvail * c.dbAvail * avSvc * avBroker * avExt;
    T('Disponibilidad', 'hosting × base de datos × Π(1−(1−' + c.instAvail + ')^k) × ' + (arch === 'C' ? 'broker × ' : '') + '(1 − (1−' + c.extAvail + ')(1−h))', fmt(avail * 100, 3) + ' %');

    // costo y esfuerzo
    const infra = a.fixedUsd + shCost + svcs.reduce((s, x, i) => s + inst[i] * x.costUsd, 0);
    const cost = infra + usage;
    T('Costo mensual (USD)', 'fijo ' + a.fixedUsd + (sh ? ' + Overpass propio ' + shCost : '') + ' + Σ instancias×precio + uso de Firestore ' + fmt(usage, 2), fmt(cost, 2));
    const effortCap = proj.teamSize * proj.weeksAvail * proj.dedication;
    T('Esfuerzo (persona-semana)', 'requerido ' + a.effortPw + ' frente a ' + proj.teamSize + ' × ' + proj.weeksAvail + ' × ' + proj.dedication + ' disponibles', fmt(a.effortPw, 0) + ' / ' + fmt(effortCap, 1));

    // requisitos obligatorios
    const checks = [
      { key: 'lat', label: 'Latencia p95 ≤ ' + proj.latMaxMs + ' ms', ok: p95 <= proj.latMaxMs, value: p95, limit: proj.latMaxMs },
      { key: 'av', label: 'Disponibilidad ≥ ' + proj.availMinPct + ' %', ok: avail * 100 >= proj.availMinPct, value: avail * 100, limit: proj.availMinPct },
      { key: 'cap', label: 'Capacidad ≥ demanda pico', ok: headroom >= 1, value: headroom, limit: 1 },
      { key: 'cost', label: 'Costo ≤ presupuesto de ' + proj.budgetUsd + ' USD', ok: cost <= proj.budgetUsd + 1e-9, value: cost, limit: proj.budgetUsd },
      { key: 'team', label: 'Esfuerzo ≤ capacidad del equipo', ok: a.effortPw <= effortCap + 1e-9, value: a.effortPw, limit: effortCap }
    ];
    const feasible = checks.every(x => x.ok);

    // puntajes normalizados 0..1 para el apoyo a la decisión
    const unav = Math.max(1 - avail, 1e-9), unavMax = 1 - proj.availMinPct / 100;
    const scores = {
      lat: clamp(1 - p95 / proj.latMaxMs, 0, 1),
      av: clamp(Math.log10(unavMax / unav) / 1.5, 0, 1),
      cost: proj.budgetUsd > 0 ? clamp(1 - cost / proj.budgetUsd, 0, 1) : 0,
      scal: clamp(Math.log2(Math.max(scal, 1)) / 4, 0, 1),
      simp: effortCap > 0 ? clamp(1 - a.effortPw / effortCap, 0, 1) : 0
    };
    const wsum = WEIGHT_KEYS.reduce((s, k) => s + proj.weights[k], 0);
    const contrib = {};
    let total = 0;
    WEIGHT_KEYS.forEach(k => { contrib[k] = scores[k] * proj.weights[k] / wsum; total += contrib[k]; });

    return {
      arch: arch, label: a.label, lambda: lambda, hitEff: hitEff, lambdaExt: lambdaExt,
      services: serviceRows, egressInst: egressInst,
      latencyMean: mean, latencyP95: p95, capacity: capacity, headroom: headroom, ceiling: ceiling, scalability: scal,
      availability: avail, cost: cost, infraCost: infra, usageCost: usage, effort: a.effortPw, effortCap: effortCap,
      uExt: uExt, saturated: uExt >= 1, pRateLimit: pRL,
      checks: checks, feasible: feasible, scores: scores, contrib: contrib, total: total, trace: trace
    };
  }

  /* ---------- Escenario completo + recomendación explicable ---------- */
  const CRIT = { lat: 'latencia', av: 'disponibilidad', cost: 'costo', scal: 'escalabilidad', simp: 'simplicidad para el equipo' };

  function recommend(results, proj) {
    const list = ARCHS.map(k => results[k]);
    const feas = list.filter(r => r.feasible).sort((x, y) => y.total - x.total);
    const ranking = list.slice().sort((x, y) => (y.feasible - x.feasible) || (y.total - x.total));
    const rec = { ranking: ranking.map(r => r.arch), feasible: feas.map(r => r.arch), reasons: [], limitations: [], assumptions: [] };
    const sentence = [];
    if (feas.length) {
      const best = feas[0];
      rec.status = 'ok'; rec.best = best.arch;
      const topK = WEIGHT_KEYS.slice().sort((x, y) => best.contrib[y] - best.contrib[x]).slice(0, 2);
      sentence.push('Se recomienda «' + best.label + '» (' + best.arch + '): cumple los 5 requisitos obligatorios y suma ' + fmt(best.total, 3) + ' puntos de 1.');
      sentence.push('Sus mayores aportes vienen de ' + CRIT[topK[0]] + ' (' + fmt(best.contrib[topK[0]], 3) + ') y ' + CRIT[topK[1]] + ' (' + fmt(best.contrib[topK[1]], 3) + ').');
      if (feas.length > 1) {
        const second = feas[1];
        const diffs = WEIGHT_KEYS.map(k => ({ k: k, d: best.contrib[k] - second.contrib[k] })).sort((x, y) => Math.abs(y.d) - Math.abs(x.d))[0];
        sentence.push('Supera a «' + second.label + '» por ' + fmt(best.total - second.total, 3) + ' puntos; la mayor diferencia está en ' + CRIT[diffs.k] + ' (' + (diffs.d >= 0 ? '+' : '') + fmt(diffs.d, 3) + ').');
        rec.margin = best.total - second.total;
        if (rec.margin < 0.03) rec.limitations.push('La diferencia con la segunda opción es menor a 0.03 puntos: cambios pequeños en los supuestos podrían invertir el orden.');
      } else {
        sentence.push('Es la única alternativa que cumple todos los requisitos obligatorios.');
      }
    } else {
      rec.status = 'none';
      const closest = list.slice().sort((x, y) => x.checks.filter(c => !c.ok).length - y.checks.filter(c => !c.ok).length || y.total - x.total)[0];
      rec.best = null; rec.closest = closest.arch;
      sentence.push('Ninguna alternativa cumple todos los requisitos obligatorios con estas entradas.');
      sentence.push('La más cercana es «' + closest.label + '» (' + closest.arch + '), que incumple: ' + closest.checks.filter(c => !c.ok).map(c => c.label).join('; ') + '.');
      sentence.push('Para continuar hay que relajar un requisito (presupuesto, equipo, plazo o latencia) o reducir la demanda simulada.');
    }
    rec.text = sentence;
    list.forEach(r => {
      if (!r.feasible) rec.reasons.push('«' + r.label + '» queda fuera: ' + r.checks.filter(c => !c.ok).map(c => c.label + ' (resultado ' + fmt(c.value, c.key === 'av' ? 3 : 2) + ')').join('; ') + '.');
    });
    rec.assumptions.push('Los valores son estimaciones del modelo, no mediciones de rendimiento real.');
    rec.assumptions.push('La API pública de OpenStreetMap responde con ' + PARAMS.common.tExtBaseMs + ' ms más ' + PARAMS.common.tExtPerPoiMs + ' ms por lugar y tolera ' + PARAMS.common.extCapPerIpRps + ' solicitudes por segundo por dirección IP.');
    rec.assumptions.push('Los pesos de decisión definidos por el equipo: ' + WEIGHT_KEYS.map(k => CRIT[k] + ' ' + fmt(proj.weights[k], 2)).join(', ') + '.');
    rec.limitations.push('El modelo no considera fallas correlacionadas, picos súbitos dentro del minuto ni diferencias entre proveedores de nube.');
    return rec;
  }

  function evalAll(v, proj, P) { const r = {}; ARCHS.forEach(k => { r[k] = computeArch(k, v, proj, P); }); return r; }
  function bestFeasible(results) {
    let b = null;
    ARCHS.forEach(k => { if (results[k].feasible && (b === null || results[k].total > results[b].total)) b = k; });
    return b;
  }
  const BUDGET_MULT = [1, 1.25, 1.5, 2, 3, 5], WEEKS_MULT = [1, 1.5, 2, 3];

  /* Cuando ninguna alternativa cumple, busca la propuesta que menos cambia el plan:
     Overpass propio, caché precalentado, más presupuesto, más plazo; y como último recurso, limitar usuarios. */
  function propose(v, proj, P) {
    const cands = [];
    (v.selfHost ? [false] : [false, true]).forEach(sh => [0, 0.2, 0.35].forEach((hb, hi) => {
      if (hb && v.hit >= 0.95) return;
      BUDGET_MULT.forEach((bm, bi) => WEEKS_MULT.forEach((wm, wi) => {
        cands.push({ sh: sh, hb: hb, bm: bm, wm: wm, pen: (sh ? 2 : 0) + hi * 1.5 + bi + wi * 1.2 });
      }));
    }));
    cands.sort((a, b) => a.pen - b.pen);
    const apply = c => {
      const vv = Object.assign({}, v), pp = JSON.parse(JSON.stringify(proj));
      if (c.sh) vv.selfHost = true;
      if (c.hb) vv.hit = Math.min(0.95, Math.round((v.hit + c.hb) * 100) / 100);
      pp.budgetUsd = Math.round(proj.budgetUsd * c.bm);
      pp.weeksAvail = Math.min(104, Math.ceil(proj.weeksAvail * c.wm));
      return { vv: vv, pp: pp };
    };
    const describe = (c, vv, pp) => {
      const ch = [];
      if (c.sh) ch.push('activar un servidor propio de OpenStreetMap (Overpass autoalojado, ' + PARAMS.common.selfHostUsd + ' USD al mes)');
      if (c.hb) ch.push('precalentar el caché con los destinos más consultados (aciertos de ' + fmt(v.hit, 2) + ' a ' + fmt(vv.hit, 2) + ')');
      if (pp.budgetUsd !== proj.budgetUsd) ch.push('subir el presupuesto mensual de ' + proj.budgetUsd + ' a ' + pp.budgetUsd + ' USD');
      if (pp.weeksAvail !== proj.weeksAvail) ch.push('ampliar el plazo de ' + proj.weeksAvail + ' a ' + pp.weeksAvail + ' semanas');
      return ch;
    };
    for (let n = 0; n < cands.length; n++) {
      const c = cands[n], a = apply(c), res = evalAll(a.vv, a.pp, P), b = bestFeasible(res);
      if (b) {
        const ch = describe(c, a.vv, a.pp);
        return { kind: 'adjusted', best: b, vars: a.vv, proj: a.pp, results: res, changes: ch,
          text: ['Ninguna alternativa cumple todos los requisitos obligatorios con las entradas tal como están.',
                 'La propuesta que menos cambia el plan es ' + ch.join(', ') + '.',
                 'Con esos ajustes se recomienda «' + res[b].label + '» (' + b + '): cumple los 5 requisitos y suma ' + fmt(res[b].total, 3) + ' puntos de 1.'] };
      }
    }
    // último recurso: límite de usuarios con sala de espera, con todos los ajustes al máximo
    const cmax = { sh: true, hb: v.hit < 0.95 ? 0.35 : 0, bm: 5, wm: 3 }, am = apply(cmax);
    let u = v.users;
    for (let k = 0; k < 80; k++) {
      u = Math.floor(u * 0.9);
      if (u < 1) break;
      const vv = Object.assign({}, am.vv, { users: u }), res = evalAll(vv, am.pp, P), b = bestFeasible(res);
      if (b) {
        const ch = describe(cmax, am.vv, am.pp).concat(['limitar a ' + u + ' usuarios simultáneos con una sala de espera para el resto']);
        return { kind: 'throttle', best: b, vars: vv, proj: am.pp, results: res, changes: ch, maxUsers: u,
          text: ['Con ' + v.users + ' usuarios simultáneos ninguna alternativa cumple los requisitos, ni siquiera con todos los ajustes al máximo.',
                 'La propuesta es ' + ch.join(', ') + '.',

  /* scope: 'one' (escenario indicado) o 'all'. Reejecuta los escenarios cuyas variables cambiaron para que el PDF refleje lo que hay en pantalla. */

    } else {

    }
    printPage(buildReport(ids), scope === 'all' ? 'Locus-simulacion-todos-los-escenarios' : 'Locus-simulacion-' + (scen(id).name || id).replace(/[^A-Za-z0-9]+/g, '-'), hint);
  }

    var onBefore = function () { fired = true; };

    window.addEventListener('afterprint', function done() { window.removeEventListener('afterprint', done); window.removeEventListener('beforeprint', onBefore); restore(); });
    root.setAttribute('data-theme', 'light');

  /* ----- escenarios como pruebas ----- */
  function selectedIds() { return state.scenarios.filter(function (s) { return state.sel[s.id] !== false; }).map(function (s) { return s.id; }); }

  function scenItems(ids) {
    return ids.map(function (id) {
      var s = scen(id);
      return {
        id: id, label: s.name,
        execute: function () { /* lógica real del modelo; no guarda nada hasta terminar la animación */
          var errs = M.validate(s.vars, state.proj); if (errs.length) throw new Error(errs[0]);
          var vars = JSON.stringify(s.vars), ps = sig(), r = M.runScenario(s.vars, state.proj);

        },
        classify: function (x) {

          if (!rc.best) return { state: 'error', summary: 'Ninguna alternativa cumple los requisitos con estas entradas.' };
          if (rc.status === 'ok') return { state: 'done', summary: 'Correcta: se recomienda «' + P[rc.best].label + '».' };
          return { state: 'warn', summary: 'Con observaciones: ninguna alternativa cumple tal cual; el simulador propone ajustes sobre «' + P[rc.best].label + '».' };

    }

  }
  function scenState(id, snap) {
    var it = snap.items.filter(function (i) { return i.id === id; })[0], e = state.runs[id];
    if (it && it.state === 'running') return { st: 'running', note: 'El modelo calcula mientras se muestra la animación.' };
    if (it && it.state === 'pending') return { st: 'queued', note: 'Espera su turno.' };
    if (it && it.state === 'skipped') return { st: 'skipped', note: it.summary };
    if (it && it.state === 'error' && !e) return { st: 'error', note: it.summary };
    if (e) {
      if (isStale(id)) return { st: 'stale', note: 'Cambiaste valores después de ejecutar: este resultado ya no corresponde a la configuración actual.' };
      var rc = e.run.recommendation, st = rc.best ? (rc.status === 'ok' ? 'done' : 'warn') : 'error';

    root.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-go')); }; });
    root.querySelectorAll('[data-test]').forEach(function (b) { b.onclick = function () { state.testSel = b.getAttribute('data-test'); stopPreview(); keepFocus(renderPruebas); startPreview(state.testSel, 'test'); }; });
    wireMotion(renderPruebas);
    var tp = $('#tPrev'); if (tp) tp.onclick = function () { startPreview(testShownId(TESTR.snapshot()), 'test'); };
    $('#runTests').onclick = function () { stopPreview(); startTests(); };
    var sk = $('#tSkip'); if (sk) sk.onclick = function () { TESTR.skip(); };
    var sp = $('#tStop'); if (sp) sp.onclick = function () { TESTR.stopAfterCurrent(); };
    var an = $('#tAnim'); if (an) an.onchange = function () { state.animOn = an.checked; };
    paintTestStage(snap);
    var sid = testShownId(snap), sit = snap.items.filter(function (i) { return i.id === sid; })[0];
    if (!running && (!state.preview || state.preview.kind !== 'test') && !(sit && (sit.state === 'done' || sit.state === 'error'))) startPreview(sid, 'test');
  }

  /* ---------- 6. Documentación ---------- */
  function renderDoc() {
    var varsRows = Object.keys(M.VARS).map(function (k) { var d = M.VARS[k]; return '<tr><td><code>' + k + '</code></td><td>' + d.label + '</td><td>' + d.min + ' a ' + d.max + ' ' + d.unit + '</td><td>' + WHY[k] + '</td></tr>'; }).join('');
    var parRows = [
      ['tExtBaseMs', C.tExtBaseMs, 'ms', 'Latencia base de Overpass y Nominatim'], ['tExtPerPoiMs', C.tExtPerPoiMs, 'ms por lugar', 'Tamaño de la respuesta'],
      ['routeUsPerN2', C.routeUsPerN2, 'µs', 'Vecino más cercano O(n²) en servidor'], ['clientCpuFactor', C.clientCpuFactor, '×', 'Teléfono frente a servidor'],
      ['renderMs', C.renderMs, 'ms', 'Pintar el itinerario'], ['cacheReadMs', C.cacheReadMs, 'ms', 'Leer del caché'], ['parseMsPerPoi', C.parseMsPerPoi, 'ms por lugar', 'Interpretar la respuesta del mapa'],
      ['rhoTarget', C.rhoTarget, '', 'Utilización objetivo de servidores'], ['rhoExtTarget', C.rhoExtTarget, '', 'Uso cómodo de la API pública'],
      ['extCapPerIpRps', C.extCapPerIpRps, 'req/s', 'Tolerancia de la API pública por IP'], ['extCapGlobalRps', C.extCapGlobalRps, 'req/s', 'Parte pública que le toca a Locus (clientes directos)'],
      ['selfHostTExtBaseMs / selfHostCapRps / selfHostUsd', C.selfHostTExtBaseMs + ' / ' + C.selfHostCapRps + ' / ' + C.selfHostUsd, 'ms / req/s / USD', 'Overpass propio: consulta base, capacidad y costo mensual'], ['rateLimitPerIpPerMin', C.rateLimitPerIpPerMin, 'req/min', 'Umbral del error 429 por usuario'], ['rateLimitBackoffMs', C.rateLimitBackoffMs, 'ms', 'Espera tras un 429'],
      ['localCacheFactor (A)', P.A.localCacheFactor, '', 'Aciertos del caché solo en el teléfono frente a uno compartido'],
      ['extAvail', C.extAvail, '', 'Disponibilidad de los espejos de Overpass'], ['dbAvail / hostingAvail', C.dbAvail, '', 'Firestore y Hosting'], ['instAvail', C.instAvail, '', 'Una instancia de servidor'],
      ['minReplicas', C.minReplicas, '', 'Réplicas mínimas por servicio si el presupuesto alcanza'], ['dutyHoursPerDay', C.dutyHoursPerDay, 'h', 'Horas al día a la carga simulada'],
      ['freeOpsPerMonth', C.freeOpsPerMonth, 'ops', 'Cuota gratuita de Firestore'], ['usdPerMillionOps', C.usdPerMillionOps, 'USD', 'Costo por millón de operaciones'], ['opsPerRequest', C.opsPerRequest, 'ops', 'Operaciones de Firestore por solicitud'],
      ['p95Queue / p95Ext / p95Ramp', C.p95Queue + ' / ' + C.p95Ext + ' / ' + C.p95Ramp, '', 'Factores del percentil 95']
    ].map(function (r) { return '<tr><td><code>' + r[0] + '</code></td><td class="num">' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>'; }).join('');
    $('#v-documentacion').innerHTML =
      '<div><h2>Documentación del simulador</h2><p class="lead">Describe el modelo, las variables, las fórmulas, los criterios de decisión, el uso y las limitaciones.</p></div>' +
      '<div class="row"><button class="btn primary" id="docPdf" type="button">Descargar PDF de la documentación</button><span class="small hint-pdf" id="docHint" role="status">Se abre el cuadro de impresión: elige «Guardar como PDF».</span></div>' +
      '<div class="card"><h3>Enlace al simulador</h3><div class="copy"><code id="selfUrl"></code><button class="btn" id="copyUrl" type="button">Copiar enlace</button><span class="small" id="copyMsg" role="status"></span></div></div>' +
      '<div class="card"><h2>1. Descripción del modelo</h2><p>El simulador compara tres arquitecturas para Locus (cliente directo, monolito con caché y microservicios) con las mismas entradas. Para cada una calcula la demanda, reparte instancias según el presupuesto, estima cola, latencia, capacidad, disponibilidad y costo, verifica cinco requisitos obligatorios y puntúa las que cumplen con los pesos del equipo.</p>' +
      '<p>La parte dominante del tiempo de respuesta es la consulta a OpenStreetMap, y la diferencia entre arquitecturas está en cuánta de esa consulta evitan mediante caché, cuánta capacidad tienen para atender la demanda y qué cuestan.</p></div>' +
      '<div class="card"><h2>2. Variables de entrada</h2><div class="tablewrap"><table><thead><tr><th>Variable</th><th>Significado</th><th>Rango válido</th><th>Relación con requisitos y resultados</th></tr></thead><tbody>' + varsRows + '</tbody></table></div><p class="small">Además se configuran en la pestaña Proyecto: latencia máxima, disponibilidad mínima, presupuesto, equipo, semanas, dedicación y pesos.</p></div>' +
      '<div class="card"><h2>3. Fórmulas</h2><pre>' + esc(
'Demanda\n  λ = usuarios × solicitudes_por_minuto / 60                         [req/s]\n  aciertos efectivos h = aciertos (B, C)  |  aciertos × 0.35 (A)\n  λ_ext = λ × (1 − h)\n\n' +
'Servicios (B y C)\n  D = base + porLugar·n [+ ruta n²·2µs] [+ (1−h)·0.4·n + h·2]       [ms por solicitud]\n  instancias k = clamp( máx( ⌈λ·D/1000/0.7⌉, ⌈λ_ext/(8·0.5)⌉ si sale a OSM, 2 ), 1, máx_k )\n  si costo > presupuesto: quitar una instancia al servicio con más réplicas, hasta cumplir\n  ρ = λ·D / (k·1000)        R = D / (1 − ρ)        (M/M/1 por servicio)\n\n' +
'API externa\n  capacidad = k_salida × 8 req/s (B, C)  |  40 req/s (A)\n  T_ext = 900 + 25·n  (300 + 25·n con Overpass propio, capacidad 60 req/s, +30 USD)\n  u = λ_ext / capacidad        T_ext_ef = T_ext × (1 + u / (2(1−u)))   (M/D/1)\n\n' +
'Latencia\n  B, C: media = RTT + saltos + render + ΣR + (1−h)·T_ext_ef\n        p95   = RTT + saltos + render + 3·ΣR + 1.5·rampa·T_ext_ef,  rampa = mín(1, (1−h)/0.05)\n  A:    media = ruta_en_teléfono + render + h·2 + (1−h)·(RTT + T_ext_ef + P429·2000)\n        p95   = ruta + render + RTT + 1.5·rampa·T_ext_ef + mín(1, P429/0.05)·2000\n        P429 = máx(0, mín(1, (solicitudes_por_min − 6)/6))\n\n' +
'Capacidad y escalabilidad\n  capacidad = mín( mín_s k_s·0.7·1000/D_s , 0.5·capacidad_ext/(1−h) )     margen = capacidad / λ\n  escalabilidad = techo técnico (con máx_k instancias) / λ\n\n' +
'Disponibilidad\n  Disp = hosting × Firestore × Π_s (1 − (1−0.995)^k_s) × [broker 0.999 en C] × (1 − (1−0.99)(1−h))\n\n' +
'Costo\n  costo = fijo + Σ k_s × precio_s + máx(0, ops_mes − 600 000)/10⁶ × 0.9\n  ops_mes = λ × 3600 × 3 h × 30 días × 0.2\n') + '</pre></div>' +
      '<div class="card"><h2>4. Parámetros y supuestos</h2><div class="tablewrap"><table><thead><tr><th>Parámetro</th><th class="num">Valor</th><th>Unidad</th><th>Qué representa</th></tr></thead><tbody>' + parRows + '</tbody></table></div>' +
      '<ul class="plain"><li>Todos los valores son supuestos del equipo basados en el comportamiento típico de las APIs públicas y de los artículos del curso. No son mediciones.</li><li>Las solicitudes llegan de forma uniforme durante las horas simuladas.</li><li>Cada instancia de servidor tiene su propia IP de salida.</li><li>Los esfuerzos de desarrollo (6, 10 y 24 persona-semanas) son estimaciones del equipo.</li></ul></div>' +
      '<div class="card"><h2>5. Criterios de decisión</h2><ol class="plain"><li><b>Requisitos obligatorios.</b> Se descarta toda alternativa que incumpla: latencia p95 máxima, disponibilidad mínima, capacidad para la demanda pico (margen ≥ 1), costo dentro del presupuesto y esfuerzo dentro de la capacidad del equipo.</li><li><b>Puntaje 0 a 1 por criterio.</b> Latencia: 1 − p95/límite. Disponibilidad: log₁₀(indisponibilidad permitida / indisponibilidad calculada)/1.5. Costo: 1 − costo/presupuesto. Escalabilidad: log₂(techo/demanda)/4. Simplicidad: 1 − esfuerzo/capacidad del equipo. Todos limitados a [0, 1].</li><li><b>Suma ponderada</b> con los pesos normalizados del equipo. Gana el mayor puntaje entre las que cumplen. Si ninguna cumple, el simulador busca la propuesta que menos cambia el plan, probando en este orden de esfuerzo: servidor propio de OpenStreetMap (Overpass autoalojado), precalentar el caché (+0.20 o +0.35 de aciertos), subir el presupuesto (×1.25 a ×5) y ampliar el plazo (×1.5 a ×3). Cada combinación se vuelve a simular y se elige la primera donde alguna alternativa cumple los 5 requisitos. Si ni con todos los ajustes al máximo alcanza, propone limitar los usuarios simultáneos con una sala de espera y calcula el límite. Solo si el requisito es imposible incluso con un usuario (por ejemplo, 200 ms de latencia) se indica cuál se acerca más y qué requisito falla.</li></ol></div>' +
      '<div class="card"><h2>6. Instrucciones de uso</h2><ol class="plain"><li>En Proyecto, revisa los requisitos, el presupuesto, el equipo y los pesos.</li><li>En Escenarios, ajusta el escenario de referencia y los demás, o crea uno nuevo.</li><li>En Simulación, marca los escenarios y pulsa «Ejecutar»: cada uno corre en el modelo mientras ves una escena animada con turistas, la página de Locus y las tres arquitecturas. En Pruebas, cada una de las 12 pruebas del modelo tiene su propia escena.</li><li>También puedes pulsar «Ejecutar todos los escenarios» desde Resultados.</li><li>En Resultados, lee la recomendación, la tabla de requisitos, los indicadores y los gráficos. Usa el barrido para ver el punto donde cambia la decisión.</li><li>Abre la trazabilidad para verificar cualquier número con su fórmula.</li><li>En Pruebas, pulsa «Ejecutar las pruebas ahora» y comprueba que el modelo se comporta de forma coherente.</li></ol></div>' +
      '<div class="card"><h2>7. Limitaciones</h2><ul class="plain"><li>Los resultados son estimaciones del modelo, no mediciones de rendimiento real.</li><li>No hay picos dentro del minuto, fallas correlacionadas ni diferencias entre proveedores de nube.</li><li>Un monolito en una sola máquina suele superar a los microservicios en rendimiento puro, según los artículos, y el resultado no se generaliza a todos los sistemas.</li><li>El modelo supone que la API pública de OSM se comporta igual en todo el día.</li><li>La seguridad y el cifrado no se modelan como indicador.</li></ul>' +
      '<h3>Información adicional para validar en una aplicación real</h3><ul class="plain"><li>Latencias y tasas de error reales de Overpass, Nominatim y Open-Elevation, medidas desde Colombia.</li><li>Tasa real de aciertos de caché con usuarios reales.</li><li>Precios actuales del proveedor y consumo real de Firestore.</li><li>Pruebas de carga con JMeter o k6 sobre un prototipo de cada alternativa.</li></ul></div>' +
      '<div class="card"><h2>8. Referencias</h2><ul class="plain"><li>From Monolithic Systems to Microservices: A Comparative Study of Performance.</li><li>Monolithic vs. Microservice Architecture: A Performance and Scalability Evaluation.</li><li>A Comparative Review of Microservices and Monolithic Architectures.</li><li>MVC Architecture: A Comparative Study Between Laravel Framework and Slim Framework in Freelancer Project Monitoring System Web Based.</li></ul></div>';
    var url = ''; try { url = location.href.split('#')[0]; } catch (e) {}
    $('#selfUrl').textContent = url || '(abre el simulador desde su enlace publicado)';
    $('#docPdf').onclick = function () {
      var clone = $('#v-documentacion').cloneNode(true);
      var drop = [clone.firstElementChild, clone.querySelector('#docPdf').parentNode, clone.querySelector('#selfUrl').closest('.card')];
      drop.forEach(function (n) { if (n && n.parentNode) n.parentNode.removeChild(n); });
      var fecha = new Date().toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' });
      printPage('<div class="rep-head"><h1>Documentación del simulador de arquitectura de Locus</h1><p>Ingeniería Aplicada · Actividad 9 · Universidad Libre · Tres Felices Tigres · ' + esc(fecha) + '</p><p>Los resultados del simulador son estimaciones del modelo con los parámetros documentados, no mediciones de rendimiento.</p></div><div class="docprint">' + clone.innerHTML + '</div>', 'Locus-documentacion-simulador', $('#docHint'));
    };
    $('#copyUrl').onclick = function () {
      var m = $('#copyMsg');
      try { navigator.clipboard.writeText(url).then(function () { m.textContent = 'Enlace copiado'; }, function () { sel(); }); } catch (e) { sel(); }
      function sel() { var r = document.createRange(); r.selectNodeContents($('#selfUrl')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); m.textContent = 'Enlace seleccionado, cópialo con el menú'; }
    };
  }

  /* ---------- tema e inicio ---------- */
  buildTabs();
  $('#pager').addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (b) go(b.dataset.v); });
  var h = (location.hash || '').replace('#', '');
  var start = VIEWS.some(function (v) { return v[0] === h; }) ? h : 'proyecto';
  go(start, true);
  window.addEventListener('hashchange', function () { var x = (location.hash || '').replace('#', ''); if (VIEWS.some(function (v) { return v[0] === x; }) && x !== state.view) go(x, true); });
})();
